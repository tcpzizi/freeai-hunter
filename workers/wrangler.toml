# Cloudflare Worker deployment for the Telegram bot (workers/bot.js).
#
#   npm i -g wrangler        # or: npx wrangler ...
#   wrangler kv namespace create BOT_KV     # paste the id below
#   wrangler secret put TELEGRAM_BOT_TOKEN  # and the other secrets
#   wrangler deploy
#   curl "https://<worker>/setup?key=$ADMIN_SECRET"
#
# The local python side of this project lives in src/; nothing here is needed
# for the GitHub Actions workflows.

name = "freeai-bot"
main = "bot.js"

# ctx.waitUntil and AbortSignal.timeout need a recent runtime
compatibility_date = "2026-01-15"

workers_dev = true

# One trigger is enough; the dispatcher is idempotent because every user keeps
# its own history. 15 min cron duration and 10 ms CPU on the free plan are the
# limits that matter; dispatching 500 users costs ~0.5 s.
[triggers]
crons = ["0 * * * *"]

# Free plan: 100,000 KV reads/day, 1,000 writes/day, 1,000 ops per invocation.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[observability]
enabled = true

# Free plan caps CPU at 10 ms/request, which the HTML rendering here fits in
# easily; these limits are what the code budgets against internally.
[limits]
subrequests = 50
