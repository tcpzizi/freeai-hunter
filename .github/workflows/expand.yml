name: expand
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
# Same group as hunt/recheck: expand also writes data/state.sqlite
# (candidate_sources) before it touches config/sources.yaml.
concurrency:
  group: freeai-db
  queue: max
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: checkout data repo
        uses: actions/checkout@v4
        with:
          repository: tcpzizi/freeai-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run expand
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.expand
      - name: commit data
        run: |
          bash scripts/commit-data.sh data "expand data: $(date -u +%FT%TZ)" state.sqlite
      - name: commit config
        run: |
          bash scripts/commit-data.sh . "expand config: $(date -u +%FT%TZ)" config
