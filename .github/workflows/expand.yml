name: expand
on:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.expand
      - name: commit
        run: |
          git config user.name "freeai-hunter"
          git config user.email "bot@users.noreply.github.com"
          git add -A config data
          git diff --quiet --cached || git commit -m "expand: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push && break || sleep 6
          done
