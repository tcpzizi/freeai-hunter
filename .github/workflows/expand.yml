name: expand
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: checkout data repo
        uses: actions/checkout@v4
        with:
          repository: tcpzizi/freeai-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run expand
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.expand
      - name: commit data
        working-directory: data
        run: |
          git config user.name "freeai-hunter"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "expand data: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push && break || sleep 6
          done
      - name: commit config
        run: |
          git config user.name "freeai-hunter"
          git config user.email "bot@users.noreply.github.com"
          git add -A config
          git diff --quiet --cached || git commit -m "expand config: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push && break || sleep 6
          done
