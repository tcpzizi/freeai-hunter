name: hunt
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# Shared with recheck and expand: all three read and write the same binary
# data/state.sqlite and git cannot merge it, so they must take turns. The bot
# is deliberately NOT in this group - it never touches the database.
# A single pending slot is enough here: the next cron tick replaces a run that
# is still waiting, which is what we want when GitHub delays runs by minutes.
concurrency:
  group: freeai-db
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: checkout data repo
        uses: actions/checkout@v4
        with:
          repository: tcpzizi/freeai-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run hunter
        env:
          # publish.py pushes docs/*.json to this public repo over the contents
          # API: the JSON is generated in the private data repo, and the site
          # and the Cloudflare Worker can only read the public copy.
          PUBLIC_MIRROR_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          PUBLIC_MIRROR_REPO: tcpzizi/freeai-hunter
          PUBLIC_MIRROR_BRANCH: main
          PUBLIC_MIRROR_REQUIRED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.main
      # Only the files hunt really writes, so a bot commit that landed in the
      # meantime (or another run's touches) is not clobbered by this checkout.
      - name: commit data
        run: |
          bash scripts/commit-data.sh data "hunt data: $(date -u +%FT%TZ)" state.sqlite offers.json stats.json
      # The Cloudflare Worker and GitHub Pages read the public repo, so the
      # same JSON files are copied into docs/ here (src/publish.py writes the
      # bare list and both wrapped shapes the site accepts).
      - name: commit docs
        run: |
          bash scripts/commit-data.sh . "hunt docs: $(date -u +%FT%TZ)" docs
