name: hunt
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# Shared with recheck and expand: all three read and write the same binary
# data/state.sqlite and git cannot merge it, so they must take turns. The bot
# is deliberately NOT in this group - it never touches the database.
# queue: max keeps every scheduled run that is waiting instead of dropping the
# older ones, so a backlog delays hunting but never silently cancels it.
concurrency:
  group: freeai-db
  queue: max
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: checkout data repo
        uses: actions/checkout@v4
        with:
          repository: tcpzizi/freeai-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run hunter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.main
      # Only the files hunt really writes, so a bot commit that landed in the
      # meantime (or another run's touches) is not clobbered by this checkout.
      - name: commit data
        run: |
          bash scripts/commit-data.sh data "hunt data: $(date -u +%FT%TZ)" state.sqlite offers.json stats.json
      - name: commit docs
        run: |
          bash scripts/commit-data.sh . "hunt docs: $(date -u +%FT%TZ)" docs
