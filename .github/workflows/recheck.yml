name: recheck
on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
# Same group as hunt/expand: one writer at a time for data/state.sqlite.
concurrency:
  group: freeai-db
  queue: max
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: checkout data repo
        uses: actions/checkout@v4
        with:
          repository: tcpzizi/freeai-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run recheck
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.recheck
      - name: commit data
        run: |
          bash scripts/commit-data.sh data "recheck: $(date -u +%FT%TZ)" state.sqlite offers.json stats.json
      - name: commit docs
        run: |
          bash scripts/commit-data.sh . "recheck docs: $(date -u +%FT%TZ)" docs
