name: recheck
on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.recheck
      - name: daily digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: python -m src.bot.dispatch digest
      - name: commit
        run: |
          git config user.name "freeai-hunter"
          git config user.email "bot@users.noreply.github.com"
          git add -A data docs
          git diff --quiet --cached || git commit -m "recheck: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push && break || sleep 6
          done
