name: bot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: poll telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          RUN_SECONDS: "240"
        run: python -m src.bot.poll
      - name: commit
        run: |
          git config user.name "freeai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git diff --quiet --cached || git commit -m "bot: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push && break || sleep 6
          done
