name: bot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
# Its own group: the bot only writes data/users.json, data/bot_state.json,
# data/deliveries.json and data/feedback.json, so a slow hunt run must never
# make the bot wait (and vice versa). Default queue (single) is what we want
# here: if a poll is still pending when the next cron fires, the newest poll
# replaces it - an old poll window is worthless.
concurrency:
  group: freeai-bot
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: checkout data repo
        uses: actions/checkout@v4
        with:
          repository: tcpzizi/freeai-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          # 7 minutes of polling leaves room inside the 10-minute slot for
          # checkout + pip + commit, so one run ends before the next cron tick
          # instead of every run waiting behind the previous one.
          RUN_SECONDS: "420"
        run: python -m src.bot.poll
      - name: commit data
        # Also runs when polling fails: the Telegram offset and the user list
        # must land anyway, otherwise the next poll re-fetches updates that the
        # callers already acted on (or misses them once they expire).
        if: always()
        env:
          GIT_AUTHOR_NAME: freeai-bot
        run: >
          bash scripts/commit-data.sh data "bot: $(date -u +%FT%TZ)"
          users.json bot_state.json deliveries.json feedback.json
