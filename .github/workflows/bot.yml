name: bot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: checkout data repo
        uses: actions/checkout@v4
        with:
          repository: tcpzizi/freeai-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          RUN_SECONDS: "500"
        run: python -m src.bot.poll
      - name: commit data
        working-directory: data
        run: |
          git config user.name "freeai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "bot: $(date -u +%FT%TZ)"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase --autostash -q && git push; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed; retrying..."
            sleep $((i * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Unable to push persisted data after 3 attempts"
            exit 1
          fi
